[pytest]
pythonpath = .
asyncio_mode = auto
# One shared event loop for the whole session: the module-level asyncpg engine in
# db/client.py pools connections bound to whatever loop created them, and DB-dependent
# tests reuse that engine across test functions — a fresh loop per test (the default)
# breaks pooled-connection cleanup with "Event loop is closed".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
