services:
  scheduler:
    build: .
    command: python -m workers.scheduler
    env_file:
      - .env
    restart: unless-stopped

  poller:
    build: .
    command: python -m workers.poller
    env_file:
      - .env
    restart: unless-stopped

  outbox_publisher:
    build: .
    command: python -m workers.outbox_publisher
    env_file:
      - .env
    restart: unless-stopped
