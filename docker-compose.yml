services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # also reachable as localhost:6379 from host-run dev workers
    restart: unless-stopped

  scheduler:
    build: .
    command: python -m workers.scheduler
    env_file:
      - .env
    restart: unless-stopped

  poller:
    build: .
    command: python -m workers.poller
    env_file:
      - .env
    environment:
      # Only poller uses Redis (rule index invalidation) — override the .env default
      # (meant for host-run dev) to the compose network's service hostname.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  outbox_publisher:
    build: .
    command: python -m workers.outbox_publisher
    env_file:
      - .env
    restart: unless-stopped
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
